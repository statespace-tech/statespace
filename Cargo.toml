[package]
name = "statespace"
version = "0.5.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Statespace Technologies, Inc."]
homepage = "https://statespace.com"
documentation = "https://docs.statespace.com"
repository = "https://github.com/statespace-tech/statespace"
description = "Run commits as arms of experiments on shares of live traffic"
readme = "README.md"
keywords = ["experimentation", "ab-testing", "proxy", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.lock", "CHANGELOG.md", "LICENSE", "NOTICE", "README.md"]

[[bin]]
name = "ssp"
path = "src/main.rs"

[[bin]]
name = "statespace"
path = "src/bin/statespace.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "sso", "credentials-process", "behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sigv4 = "1.4"
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["rustls-ring"] }
base64 = "0.23"
bytes = "1"
cel-interpreter = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "7"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
rand = "0.10"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
webbrowser = "1"

[dev-dependencies]
assert_cmd = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# No `panic = "abort"`: src/proxy/assign.rs catches the panics of the CEL parser and
# evaluator, and Tokio keeps a panic in one connection's task from stopping the proxy.
