# The shop's Deployment and Service, as they run without Statespace. The proxy
# needs no change to them: `ssp proxy kubernetes` reads the Deployment and
# sends live traffic to the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: ghcr.io/acme/shop@sha256:1111111111111111111111111111111111111111111111111111111111111111
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          envFrom:
            - secretRef:
                name: shop
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8000
