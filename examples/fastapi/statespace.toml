# The shop's settings. Copy this file to the root of the shop's repository.
# The settings of the build that live runs apply.

# Shared events: in every experiment. Each rule sees one request and its
# response. The first event is the headline.
[[event]]
name = "signup"
match = '''
request.method == "POST"
  && request.path == "/signup"
  && response.status < 300
'''

[[event]]
name = "purchase"
match = 'response.headers["x-statespace-event"] == "purchase"'

# Experiments, in priority order. Set the arms with
# ssp experiment update price --arm <commit>=<share>.
[experiment.price]
max_traffic = 0.2

# The staging copy: all traffic may go to arms.
[app.shop-dev.experiment.price]
max_traffic = 1.0
