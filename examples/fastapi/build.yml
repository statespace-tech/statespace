# Build the shop's image for every pushed commit and record the build, so any
# commit can become an arm. Copy this file to .github/workflows/build.yml in
# the shop's repository. Deploy live in your own workflow, as before.
name: Build
on:
  push:
    branches: ["**"]
permissions:
  contents: read
  packages: write
  # The Statespace action proves the repository and the commit with an OIDC token.
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: ghcr.io/acme/shop:${{ github.sha }}
      - uses: statespace-tech/action@v1
        with:
          image: ghcr.io/acme/shop@${{ steps.build.outputs.digest }}
          path: .
