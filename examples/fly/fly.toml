# The Statespace proxy for the Fly.io app shop. It runs as its own app,
# shop-statespace, in the same organization as shop, so it reaches the
# units on the private network. See README.md in this folder.
app = "shop-statespace"
primary_region = "iad"

[build]
  image = "ghcr.io/statespace-tech/statespace:0.4.0"

# The command goes after the image's entry point, ssp.
[processes]
  app = "proxy fly --fly-app shop"

[env]
  STATESPACE_APP = "shop-prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
