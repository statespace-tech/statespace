[package]
name = "statespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Statespace command-line interface"

default-run = "statespace"

[lib]
name = "statespace"
path = "src/lib.rs"

[[bin]]
name = "statespace"
path = "src/main.rs"

[[bin]]
name = "gen-cli-docs"
path = "src/bin/gen_cli_docs.rs"

[features]
default = []
ssh = []

[dependencies]
clap = { workspace = true }
dirs = { workspace = true }

axum = { workspace = true }
statespace-server = { workspace = true }

tokio = { workspace = true }

reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

chrono = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

thiserror = { workspace = true }

open = "5"

inquire = "0.7"
base64.workspace = true
sha2 = "0.10.9"
urlencoding = "2.1.3"
walkdir = "2.5.0"
petname = { version = "2", default-features = false, features = ["default-rng", "default-words"] }
statespace-tool-runtime = { version = "0.1.7", path = "../../crates/statespace-tool-runtime" }
ignore = "0.4.25"
semver = "1.0.27"
flate2 = "1.1.9"
tar = "0.4.44"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
