name: Runtime tests

# Runs ssp proxy on each runtime for real: Docker, Kubernetes (kind), Cloud Run in
# the sandbox project, ECS Fargate in the sandbox account, and Fly.io in the dedicated
# test app. A v* tag runs them before the release; an admin can run them by hand on
# main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip:
        description: "Runtimes not to test, separated by commas (docker,kubernetes,cloudrun,fargate,fly)"
        required: false
        default: ""
  workflow_call:
    inputs:
      skip:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  allowed:
    name: Check who runs the tests
    runs-on: ubuntu-latest
    steps:
      - name: Require an admin and main or a v tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "::error::Run the runtime tests on main or a v tag."; exit 1 ;;
          esac
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
          if [[ "$permission" != admin ]]; then
            echo "::error::Only admins can run the runtime tests."
            exit 1
          fi

  docker:
    name: Docker
    needs: allowed
    if: ${{ !contains(format(',{0},', inputs.skip), ',docker,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked --test cli docker -- --nocapture
        env:
          STATESPACE_DOCKER_TESTS: "1"

  kubernetes:
    name: Kubernetes
    needs: allowed
    if: ${{ !contains(format(',{0},', inputs.skip), ',kubernetes,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ssp-test
      - run: cargo test --locked --test cli kind -- --nocapture
        env:
          STATESPACE_KIND_TESTS: "1"

  cloudrun:
    name: Cloud Run
    needs: allowed
    if: ${{ !contains(format(',{0},', inputs.skip), ',cloudrun,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      STATESPACE_CLOUDRUN_TESTS: "1"
      STATESPACE_TEST_GCP_PROJECT: ${{ vars.GCP_TEST_PROJECT }}
      STATESPACE_TEST_GCP_REGION: ${{ vars.GCP_TEST_REGION }}
      STATESPACE_TEST_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      STATESPACE_TEST_SSP_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/ssp
      SSP_TEST_LOGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install musl tools and cloudflared
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl --fail --silent --show-error --location --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.6/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb && rm cloudflared.deb
      # The image of the proxy that runs as its own Cloud Run service.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Sweep old test resources
        run: cargo test --locked --test cli gcp_sweeper -- --nocapture
      - run: cargo test --locked --test cli gcp_cloudrun -- --nocapture
      - name: Sweep old test resources
        if: always()
        run: cargo test --locked --test cli gcp_sweeper -- --nocapture

  fargate:
    name: Fargate
    needs: allowed
    if: ${{ !contains(format(',{0},', inputs.skip), ',fargate,') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      STATESPACE_FARGATE_TESTS: "1"
      STATESPACE_TEST_AWS_ACCOUNT: ${{ vars.AWS_TEST_ACCOUNT }}
      STATESPACE_TEST_AWS_REGION: ${{ vars.AWS_TEST_REGION }}
      SSP_TEST_LOGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Build first, so the short-lived AWS credentials last for the test.
      - run: cargo test --locked --test cli --no-run
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          role-session-name: statespace-runtime-tests-${{ github.run_id }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
      - name: Sweep old test resources
        run: cargo test --locked --test cli aws_sweeper -- --nocapture
      - run: cargo test --locked --test cli aws_fargate -- --nocapture
      - name: Sweep old test resources
        if: always()
        run: cargo test --locked --test cli aws_sweeper -- --nocapture

  fly:
    name: Fly.io
    needs: allowed
    if: ${{ !contains(format(',{0},', inputs.skip), ',fly,') }}
    runs-on: ubuntu-latest
    # The environment holds FLY_API_TOKEN, a deploy token of the test app only. Its
    # deployment rules let only main and v* tags use it. Fly.io has no GitHub OIDC.
    environment: fly-runtime-test
    # One run at a time uses the test app.
    concurrency:
      group: fly-runtime-test
      cancel-in-progress: false
    env:
      STATESPACE_FLY_TESTS: "1"
      STATESPACE_TEST_FLY_APP: ${{ vars.FLY_TEST_APP }}
      STATESPACE_TEST_FLY_ORG: ${{ vars.FLY_TEST_ORG }}
      STATESPACE_TEST_FLY_REGION: ${{ vars.FLY_TEST_REGION }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STATESPACE_TEST_SSP_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/ssp
      SSP_TEST_LOGS: "1"
    steps:
      - name: Check the Fly.io token and app
        id: setup
        shell: bash
        run: |
          # A missing token fails the job, as any untested runtime does. To release
          # without Fly.io, run with skip: fly; the release notes then say so.
          if [[ -z "$FLY_API_TOKEN" || -z "$STATESPACE_TEST_FLY_APP" ]]; then
            echo "::error::Fly.io not tested: set the secret FLY_API_TOKEN and the variable FLY_TEST_APP of the environment fly-runtime-test, or run with skip: fly."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.setup.outputs.ready == 'true'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.setup.outputs.ready == 'true'
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.setup.outputs.ready == 'true'
      - name: Install musl tools, flyctl, and cloudflared
        if: steps.setup.outputs.ready == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl --fail --silent --show-error --location --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.6/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb && rm cloudflared.deb
          curl --fail --silent --show-error --location --output flyctl.tar.gz \
            https://github.com/superfly/flyctl/releases/download/v0.4.105/flyctl_0.4.105_Linux_x86_64.tar.gz
          tar -xzf flyctl.tar.gz flyctl && sudo install flyctl /usr/local/bin/fly && rm flyctl flyctl.tar.gz
      # The image of the proxy that runs as a Machine of the test app.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        if: steps.setup.outputs.ready == 'true'
      - name: Sweep old test Machines
        if: steps.setup.outputs.ready == 'true'
        run: cargo test --locked --test cli fly_sweeper -- --nocapture
      - run: cargo test --locked --test cli fly_proxies_run_arms -- --nocapture
        if: steps.setup.outputs.ready == 'true'
      - name: Sweep old test Machines
        if: always() && steps.setup.outputs.ready == 'true'
        run: cargo test --locked --test cli fly_sweeper -- --nocapture
