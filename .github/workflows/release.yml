name: Release

on:
  push:
    tags: ["v*"]
  # A rerun of a release whose runtime tests failed: run it on the tag, and name the
  # runtimes not to test. The release notes then say so.
  workflow_dispatch:
    inputs:
      skip:
        description: "Runtimes not to test, separated by commas (docker,kubernetes,cloudrun,fargate,fly)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  main:
    name: Require a commit on main that passed CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main."; exit 1;
          }
          # Wait for CI when the tag follows the push closely.
          for _ in $(seq 60); do
            read -r status conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CI --branch main --event push --commit "$COMMIT" \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] && exit 0
              echo "::error::CI for $COMMIT concluded $conclusion."; exit 1
            fi
            sleep 20
          done
          echo "::error::No completed CI run on main for $COMMIT."
          exit 1

  check:
    needs: main
    uses: ./.github/workflows/ci.yml

  runtime:
    name: Runtime tests
    needs: main
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runtime-tests.yml
    with:
      skip: ${{ inputs.skip || '' }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: [check, runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: scripts/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Release bundle
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ssp-*
          path: dist
          merge-multiple: true
      # statespace.com serves these two files from the latest release.
      - name: Add the installer and the agent skill
        run: |
          cp install.sh dist/install.sh
          cp skills/statespace/SKILL.md dist/skill.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  image:
    name: Container image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ssp-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Unpack the Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            mkdir -p "image/${pair%%:*}"
            tar -xzf "dist/ssp-${pair##*:}-unknown-linux-musl.tar.gz" -C "image/${pair%%:*}" ssp
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io/statespace-tech/statespace
        run: >-
          docker buildx build --push
          --platform linux/amd64,linux/arm64
          --tag "ghcr.io/statespace-tech/statespace:${GITHUB_REF_NAME#v}"
          --tag ghcr.io/statespace-tech/statespace:latest
          .

  crates-io:
    name: Publish crate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # crates.io takes a crate's first version only with an API token. After it, set up
      # trusted publishing for this workflow on crates.io and delete this secret.
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check crate version
        id: crate
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${version}" >&2
            exit 1
          fi
          response=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'statespace-release-workflow (https://github.com/statespace-tech/statespace)' \
            "https://crates.io/api/v1/crates/statespace/${version}")
          case "$response" in
            200) published=true ;;
            404) published=false ;;
            *) echo "crates.io returned HTTP ${response}" >&2; exit 1 ;;
          esac
          echo "published=${published}" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        if: steps.crate.outputs.published != 'true' && env.CRATES_IO_TOKEN == ''
        id: auth
      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CRATES_IO_TOKEN }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-bundle
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip || '' }}
        shell: bash
        run: |
          set -euo pipefail
          notes=""
          IFS=, read -ra skipped <<< "$SKIP"
          for runtime in "${skipped[@]}"; do
            runtime=$(echo "$runtime" | xargs)
            if [[ -n "$runtime" ]]; then
              notes+="${runtime} not tested for this release"$'\n'
            fi
          done
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --notes "$notes" \
            --verify-tag
      - name: Remove earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Only the latest release is published. Tags stay, so history keeps its versions.
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [[ "$tag" == "$GITHUB_REF_NAME" ]] && continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done

  website:
    name: Update statespace.com
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      # The website's CI copies install.sh and skill.md from the latest release, and its
      # deploy workflow publishes the result.
      - env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::Set WEBSITE_DEPLOY_TOKEN to update statespace.com after a release."
            exit 0
          fi
          gh workflow run ci.yml --repo statespace-tech/frontend --ref main
