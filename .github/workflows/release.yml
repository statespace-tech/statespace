name: Release

on:
  push:
    tags: ["v*"]
  # A rerun of a release whose runtime tests failed: run it on the tag, and name the
  # runtimes not to test. The release notes then say so.
  workflow_dispatch:
    inputs:
      skip:
        description: "Runtimes not to test, separated by commas (docker,kubernetes,cloudrun,fargate,lambda,fly,s3,gcs)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  main:
    name: Require a commit on main that passed CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main."; exit 1;
          }
          # Wait for CI when the tag follows the push closely.
          for _ in $(seq 60); do
            read -r status conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CI --branch main --event push --commit "$COMMIT" \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] && exit 0
              echo "::error::CI for $COMMIT concluded $conclusion."; exit 1
            fi
            sleep 20
          done
          echo "::error::No completed CI run on main for $COMMIT."
          exit 1

  check:
    needs: main
    uses: ./.github/workflows/ci.yml

  runtime:
    name: Runtime tests
    needs: main
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runtime-tests.yml
    # The Fly.io job reads FLY_API_TOKEN, which a called workflow gets only this way.
    secrets: inherit
    with:
      skip: ${{ inputs.skip || '' }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: [check, runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: scripts/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Release bundle
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ssp-*
          path: dist
          merge-multiple: true
      # statespace.com serves these two files from the latest release.
      - name: Add the installer and the agent skill
        run: |
          cp install.sh dist/install.sh
          cp skills/statespace/SKILL.md dist/skill.md
      # A signed build provenance for each archive. SECURITY.md tells how to verify it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/ssp-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  image:
    name: Container image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing with cosign: the GitHub OIDC token is the identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ssp-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Unpack the Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            mkdir -p "image/${pair%%:*}"
            tar -xzf "dist/ssp-${pair##*:}-unknown-linux-musl.tar.gz" -C "image/${pair%%:*}" ssp
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/statespace-tech/statespace
          # The value covers a rerun by hand on the tag too.
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=statespace
            org.opencontainers.image.description=Run commits as arms of experiments on shares of live traffic
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=statespace
            org.opencontainers.image.description=Run commits as arms of experiments on shares of live traffic
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push ghcr.io/statespace-tech/statespace
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The folder, not the Git context: the binaries are in image/.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Sign the digest, never a tag. SECURITY.md tells how to verify it.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/statespace-tech/statespace@${DIGEST}"

  crates-io:
    name: Publish crate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # crates.io takes a crate's first version only with an API token. After it, set up
      # trusted publishing for this workflow on crates.io and delete this secret.
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check crate version
        id: crate
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${version}" >&2
            exit 1
          fi
          response=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'statespace-release-workflow (https://github.com/statespace-tech/statespace)' \
            "https://crates.io/api/v1/crates/statespace/${version}")
          case "$response" in
            200) published=true ;;
            404) published=false ;;
            *) echo "crates.io returned HTTP ${response}" >&2; exit 1 ;;
          esac
          echo "published=${published}" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        if: steps.crate.outputs.published != 'true' && env.CRATES_IO_TOKEN == ''
        id: auth
      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CRATES_IO_TOKEN }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-bundle
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip || '' }}
        shell: bash
        run: |
          set -euo pipefail
          notes=""
          IFS=, read -ra skipped <<< "$SKIP"
          for runtime in "${skipped[@]}"; do
            runtime=$(echo "$runtime" | xargs)
            if [[ -n "$runtime" ]]; then
              notes+="${runtime} not tested for this release"$'\n'
            fi
          done
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --notes "$notes" \
            --verify-tag
      - name: Remove earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Only the latest release is published. Tags stay, so history keeps its versions.
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [[ "$tag" == "$GITHUB_REF_NAME" ]] && continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done
