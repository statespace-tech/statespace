name: CI

on:
  push:
    branches: [main, search]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run format:check
      - run: npm run build

      - name: Integration tests
        if: vars.TEST_URL != ''
        run: node --test test/integration.js
        env:
          TEST_URL: ${{ vars.TEST_URL }}
